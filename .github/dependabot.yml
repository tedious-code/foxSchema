version: 2
updates:
  # npm workspace — covers all packages/* and apps/* dependencies in one pass.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/Edmonton"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Group non-major updates together so the PR queue doesn't flood.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pinned in one place, IBM_DB_VERSION in the @foxschema/sql submodule, and
      # in packages/db-db2's manifest (ibm-db-pin.test.ts keeps them equal). A
      # bump of apps/web alone always fails that test, so bump it by hand there.
      - dependency-name: ibm_db
