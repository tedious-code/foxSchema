name: Test IDs

# A comment on the pull request listing the test IDs it adds and removes, so a
# reviewer sees a change e2e tests depend on. A removed ID matters most: a test
# outside this repo, or a recorded flow, may still use it. The catalog test in
# Build Gate already fails when the generated file is stale, so the file this
# compares is true to the web app.

on:
  pull_request:
    paths:
      - apps/e2e/src/generated/test-ids.ts

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: test-ids-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Comment added and removed test IDs
    # A fork's token cannot comment; its reviewers read the diff instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$(node scripts/test-ids/diff-test-ids.mjs "origin/$BASE_REF")"
          [ -n "$body" ] || exit 0
          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- test-id-diff -->")) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          elif ! grep -q 'No test IDs added or removed' <<< "$body"; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
