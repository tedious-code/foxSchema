name: Version Bump

# Runs on every push to main (i.e. every merged PR).
# Increments the patch (0.2.N → 0.2.N+1). Skipped for `chore: bump` / `chore: release` / `[no bump]`.
on:
  push:
    branches: [main]

jobs:
  bump:
    # Skip bot bumps and intentional release commits (e.g. 0.2.0).
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore: bump version')
          && !startsWith(github.event.head_commit.message, 'chore: release')
          && !contains(github.event.head_commit.message, '[no bump]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Use a PAT or the default GITHUB_TOKEN.
          # GITHUB_TOKEN is enough for pushing to non-protected branches.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute new version
        id: ver
        run: |
          # Skip intentional releases (merge commits rarely keep "chore: release"
          # as subject — also scan recent subjects / PR branch names).
          RECENT=$(git log -8 --pretty=%s)
          if echo "$RECENT" | grep -qiE '^chore: release|\[no bump\]'; then
            echo "Skipping bump (recent chore: release / [no bump])"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$RECENT" | grep -qiE 'Merge pull request .*release|Merge pull request .*0-2-0'; then
            echo "Skipping bump (release merge)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(jq -r '.version' package.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          BUILD=$(echo "$CURRENT" | cut -d. -f3)
          NEW_BUILD=$((BUILD + 1))
          NEW="${MAJOR}.${MINOR}.${NEW_BUILD}"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW"

      - name: Update package.json files
        if: steps.ver.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.new }}
          # packages/sql is deliberately NOT here. It is published to npm on its
          # own line, so its version has to describe *its* API — bumping it with
          # every app release would ship a new @foxschema/sql whose contents did
          # not change, and consumers could not tell a dialect change from a UI
          # fix. Bump it by hand when its surface or behaviour changes:
          #   npm version <patch|minor|major> -w @foxschema/sql --no-git-tag-version
          # packages/db and packages/db-db2 stay in lockstep: internal workspace packages,
          # not published, so their numbers are only ever cosmetic.
          for f in \
            package.json \
            packages/db/package.json \
            packages/db-db2/package.json \
            apps/web/package.json \
            apps/cli/package.json; do
            jq --arg v "$V" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # The lockfile records each workspace package's version too, so a bump
          # that skips it leaves the committed lockfile claiming the old one
          # forever — the artifact stops describing the tree it ships with,
          # which is the whole reason it is committed. (npm 11's `npm ci`
          # tolerates the mismatch rather than failing, so this is about the
          # lockfile staying truthful, not about unblocking CI.)
          # --package-lock-only touches nothing but the lockfile.
          npm install --package-lock-only --ignore-scripts

      - name: Commit and push
        if: steps.ver.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.new }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            packages/db/package.json \
            packages/db-db2/package.json \
            apps/web/package.json \
            apps/cli/package.json
          # No [skip ci]. GitHub honours that marker on *every* push event for
          # the commit, tag pushes included — and the release tag lands on
          # exactly this commit, so the marker silently disabled Release Gate,
          # npm Publish and Web Release. v0.2.111 and v0.2.220 were both tagged
          # and neither fired anything; the last tag that ran a release was
          # v0.2.73, whose commit was an ordinary fix.
          #
          # The loop this marker looked like it was preventing is already
          # prevented by the `if:` on this job, which refuses to bump a
          # "chore: bump version" commit. The CI it saved is now saved by a
          # matching guard on each push-triggered workflow.
          git commit -m "chore: bump version to $V"
          git push
