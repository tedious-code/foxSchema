# FoxSchema — test databases for all 6 server-based providers.
# SQLite needs no container — seed files are in docker/init/sqlite/.
#
# First start:  docker compose up -d        (auto-seeds demo_a / demo_b schemas)
# Stop:         docker compose down
# Logs:         docker compose logs -f <service>
# Full reset:   docker compose down -v && docker compose up -d
#
# Init scripts only run once (when the data volume is empty).
# After a full reset they re-run automatically — no manual seeding needed.
#
# Apple Silicon: DB2 requires Rosetta — enable in Docker Desktop → Settings →
# "Use Rosetta for x86/amd64 emulation on Apple Silicon".

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: foxschema-postgres
    environment:
      POSTGRES_USER: foxuser
      POSTGRES_PASSWORD: foxpass
      POSTGRES_DB: foxdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxuser -d foxdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8
    container_name: foxschema-mysql
    environment:
      MYSQL_ROOT_PASSWORD: foxrootpass
      MYSQL_USER: foxuser
      MYSQL_PASSWORD: foxpass
      MYSQL_DATABASE: foxdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "foxuser", "-pfoxpass"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── MariaDB 11 ──────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: foxschema-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: foxrootpass
      MARIADB_USER: foxuser
      MARIADB_PASSWORD: foxpass
      MARIADB_DATABASE: foxdb
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/init/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── SQL Server 2022 ─────────────────────────────────────────────────────────
  # Uses a custom entrypoint that starts sqlservr, waits for it to be ready,
  # seeds the demo schemas once, then keeps the process running.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: foxschema-sqlserver
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FoxPass123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/init/sqlserver:/docker-init:ro
    entrypoint: ["/bin/bash", "/docker-init/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'FoxPass123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Oracle Free 23c (ARM64-native) ──────────────────────────────────────────
  # Init scripts in /container-entrypoint-initdb.d run after the DB is ready.
  # 01_seed.sh connects as SYSTEM to create demo_a / demo_b users and objects.
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: foxschema-oracle
    environment:
      ORACLE_PASSWORD: FoxPass123
      ORACLE_DATABASE: FOXDB
      APP_USER: foxuser
      APP_USER_PASSWORD: foxpass
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/init/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── IBM DB2 Community Edition (x86 only — runs via Rosetta on Apple Silicon) ─
  db2:
    image: icr.io/db2_community/db2
    platform: linux/amd64
    container_name: foxschema-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: foxpass
      DBNAME: foxdb
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database
      # The community image auto-execs every file directly under /var/custom
      # (not docker-entrypoint-initdb.d like Postgres/MySQL) — only the wrapper
      # script goes there. The .sql it runs is mounted at a separate path so the
      # "run every file in this dir" loop doesn't also try to exec the SQL file.
      - ./docker/init/db2/01_seed.sh:/var/custom/01_seed.sh:ro
      - ./docker/init/db2/01_seed.sql:/var/custom-sql/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to foxdb' | grep -q 'Database Connection Information'"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 120s

  # ── CockroachDB (PostgreSQL wire-compatible, distributed SQL) ────────────────
  # No docker-entrypoint-initdb.d — seeded via scripts/seed/seed-all.sh (which
  # execs `cockroach sql` into the running node). Uses a trigger-free seed
  # (docker/init/cockroachdb/01_seed.sql) since CockroachDB has no triggers.
  cockroachdb:
    image: cockroachdb/cockroach:latest
    container_name: foxschema-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── YugabyteDB (PostgreSQL-compatible distributed SQL; YSQL on 5433) ─────────
  # YSQL reuses the Postgres query layer, so it seeds from the SAME Postgres seed
  # (docker/init/postgres/01_seed.sql) via seed-all.sh. YSQL binds the node's
  # address, so the healthcheck/seed connect via `hostname -i`, not localhost.
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    container_name: foxschema-yugabytedb
    # yugabyted defaults advertise_address to the container hostname and then
    # resolves it; when that name has no DNS entry it dies at startup with
    # "socket.gaierror: Name or service not known". Pin it to the container's
    # own IP — always resolvable, and unlike loopback it stays reachable from
    # the seed scripts, which connect via `hostname -i`.
    # `hostname -i` prints every address the container holds, so take the first
    # — a second attached network would otherwise word-split into a stray
    # positional argument (seed-all.sh already guards this the same way).
    command:
      - bash
      - -c
      - bin/yugabyted start --background=false --advertise_address=$$(hostname -i | awk '{print $$1}')
    ports:
      - "5433:5433"
      - "15433:15433"
    volumes:
      - yugabyte_data:/root/var
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname -i) -p 5433 -U yugabyte -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ── ClickHouse (HTTP interface on 8123 — matches @clickhouse/client) ────────
  # Seeded via scripts/seed/seed-all.sh (clickhouse-client). Databases demo_a /
  # demo_b act as schemas for the FoxSchema ClickHouse provider.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: foxschema-clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: foxpass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # A backup disk, so BACKUP … TO Disk('backups', …) runs.
      - ./docker/init/clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password foxpass -q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── TiDB (MySQL protocol on 4000, unistore single-node) ─────────────────────
  # Seeded via seed-all.sh with docker/init/tidb/01_seed.sql (demo_a / demo_b).
  tidb:
    image: pingcap/tidb:v8.5.0
    container_name: foxschema-tidb
    command: ["--store=unistore", "--path=/tmp/tidb", "-P=4000", "--status=10080"]
    ports:
      - "4000:4000"
      - "10080:10080"
    healthcheck:
      # Image has no mysql client — probe the status HTTP port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/10080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── Redshift local stand-in (Postgres 16 on host port 5439) ─────────────────
  # Amazon Redshift is cloud-only; this Postgres image lets the Redshift
  # provider / e2e path run locally. Catalog parity is Postgres-shaped, not a
  # full Redshift clone. SSL is enabled because the Redshift connection string
  # defaults to sslmode=require. Seeds reuse docker/init/postgres/01_seed.sql.
  redshift:
    image: postgres:16
    container_name: foxschema-redshift
    environment:
      POSTGRES_USER: foxuser
      POSTGRES_PASSWORD: foxpass
      POSTGRES_DB: foxdb
    ports:
      - "5439:5432"
    volumes:
      - redshift_data:/var/lib/postgresql/data
      - ./docker/init/postgres/01_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
      - ./docker/init/redshift/entrypoint.sh:/usr/local/bin/foxschema-redshift-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/foxschema-redshift-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxuser -d foxdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DuckDB is file-based (like SQLite) — no server container. seed-all.sh writes
  # /tmp/foxschema-duckdb/demo_{a,b}.duckdb via scripts/seed/seed-duckdb.mjs.

  # Redis and MongoDB are connection-only here: no SQL dialect, no GRANT model,
  # no command-mode client. They still had no container at all, so nothing
  # verified that the app can reach them or that it describes them correctly.
  redis:
    image: redis:7-alpine
    container_name: foxschema-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: foxschema-mongodb
    # Auth on deliberately. Without it every role is decorative — a `read` user
    # can insert — so a permission test against it proves nothing.
    environment:
      MONGO_INITDB_ROOT_USERNAME: foxroot
      MONGO_INITDB_ROOT_PASSWORD: FoxPass123
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ping:1})" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  mysql_data:
  mariadb_data:
  sqlserver_data:
  oracle_data:
  db2_data:
  cockroach_data:
  yugabyte_data:
  clickhouse_data:
  redshift_data:
  redis_data:
  mongo_data:
