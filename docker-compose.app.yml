# Fox Schema — self-host the web app (single image, all dialects including Db2).
# Separate from the root docker-compose.yml, which spins up the test databases.
#
# Pull-and-run (no .env needed — entrypoint auto-creates APP_ENCRYPTION_KEY on /data):
#   docker compose -f docker-compose.app.yml up -d
#
# Or build locally (linux/amd64 — ibm_db has no arm64 build):
#   docker compose -f docker-compose.app.yml up -d --build
#
# Optional: set APP_ENCRYPTION_KEY in .env to pin the key yourself.
# Open http://localhost:${PORT}  (default 3210). See docs/DEPLOYMENT.md.
#
# Workflow engine (opt-in — it needs its own token and encryption key, and a
# local image that contains apps/workflow-server):
#   WORKFLOW_ENGINE_ENDPOINT=http://workflow:8081 \
#   WORKFLOW_ENGINE_TOKEN=… FOXFLOW_ENCRYPTION_KEY=… \
#   docker compose -f docker-compose.app.yml --profile workflow up -d --build

services:
  fox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_DB2: 'true'
    platform: linux/amd64
    # Prefer the published Hub image; `up --build` still builds locally.
    image: ${FOX_IMAGE:-5nickels/foxschema:latest}
    # Publish host ${PORT} -> the container's ${API_PORT}. Set PORT in .env to
    # avoid clashing with your other services.
    ports:
      - '${PORT:-3210}:${API_PORT:-3210}'
    environment:
      API_PORT: ${API_PORT:-3210}
      # Optional — when unset, docker-entrypoint.sh generates and persists a key
      # at /data/.app_encryption_key on first boot.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_DB_ENGINE: ${APP_DB_ENGINE:-sqlite}
      APP_DB_PATH: ${APP_DB_PATH:-/data/foxschema.db}
      APP_DB_URL: ${APP_DB_URL:-}
      APP_KEY_SCHEME: ${APP_KEY_SCHEME:-v1}
      LOCAL_SINGLE_USER: ${LOCAL_SINGLE_USER:-true}
      NODE_ENV: production
      # Unsaved engine default. A value saved in Workflow settings still wins.
      WORKFLOW_ENGINE_ENDPOINT: ${WORKFLOW_ENGINE_ENDPOINT:-}
      WORKFLOW_ENGINE_TOKEN: ${WORKFLOW_ENGINE_TOKEN:-}
    volumes:
      - fox_data:/data
    restart: unless-stopped

  workflow:
    profiles: ['workflow']
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_DB2: 'true'
    image: ${FOX_IMAGE:-5nickels/foxschema:latest}
    platform: linux/amd64
    command: ['node_modules/.bin/tsx', 'apps/workflow-server/src/server.ts']
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      WORKFLOW_ENGINE_TOKEN: ${WORKFLOW_ENGINE_TOKEN:-}
      FOXFLOW_ENCRYPTION_KEY: ${FOXFLOW_ENCRYPTION_KEY:-}
      FOXSCHEMA_URL: http://fox:${API_PORT:-3210}
      FOXFLOW_DB_PATH: /data/workflow-engine.sqlite
      FOXFLOW_FILES_DIR: /data/workflow-files
      WORKFLOW_LOG_DIR: /data/workflow-logs
    volumes:
      - workflow_data:/data
    depends_on:
      - fox
    restart: unless-stopped

volumes:
  fox_data:
  workflow_data:
