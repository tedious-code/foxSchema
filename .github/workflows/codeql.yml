name: CodeQL Analysis

# CodeQL is NOT a PR gate — it is too slow (5–15 min) to block developer feedback.
# Findings appear in the GitHub Security tab automatically.
# Runs:
#   - Every push to main (catches anything that slipped through PR checks)
#   - Weekly on Monday at 02:00 UTC (baseline drift detection)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    # A version-bump commit changes four package.json version fields and
    # nothing else, so there is nothing here for it to check. It used to carry
    # `[skip ci]` for this, but that marker also suppresses the *tag* push that
    # rides on the same commit, which silently disabled every release — see
    # version-bump.yml. Skipping by message keeps the saving without that cost.
    # Guarded on event_name so pull_request runs are never skipped.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    name: CodeQL — JavaScript / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm 10 (what Node 22 ships) cannot resolve this workspace graph
      # without a lockfile — arborist dies in #loadPeerSet on vitest with
      # "Cannot read properties of null (reading 'edgesOut')". npm 11 does
      # it fine. Verified on a clean clone at Node 22.23.1.
      - run: npm i -g npm@11

      # CodeQL needs installed dependencies to resolve imports properly.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # "javascript" covers both JS and TS — no need to list both.
          languages: javascript
          # security-and-quality includes OWASP Top 10 patterns.
          queries: security-and-quality

      # Let CodeQL auto-detect the build (TypeScript projects typically need no explicit step).
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # continue-on-error: SARIF upload requires GitHub Advanced Security on private repos.
      # The analysis itself still runs; findings are logged in the job output.
      - name: Run CodeQL analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
          upload: true
