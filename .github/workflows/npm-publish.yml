name: npm Publish

# Publishes the public `foxschema` CLI package (browser launcher + line commands).
# Trigger: version tag `v*`, GitHub Release published, or workflow_dispatch.
#
# Auth: npm Trusted Publishing (OIDC). No token — the registry verifies the
# workflow identity GitHub signs for this run, so there is nothing stored to
# expire, leak, or rotate. Registered on npmjs.com against this repository and
# this workflow file; renaming either one breaks publishing until the trusted
# publisher entry is updated to match.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.1.66). Empty = current ref.'
        required: false

permissions:
  contents: read
  # Lets GitHub mint the OIDC token npm exchanges for publish rights.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's Trusted Publisher entry for this workflow names the GitHub
    # environment `npm-publish`, and npm only accepts the OIDC token from a job
    # running in it. Without this line npm gives no credentials and `npm publish`
    # fails with ENEEDAUTH (v0.3.1, 2026-11-08). Renaming either side breaks it.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No registry-url: it writes an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}` and exports the literal placeholder
          # XXXXX-XXXXX-XXXXX-XXXXX. npm then sends that as a bearer token and
          # never reaches for OIDC, so Trusted Publishing cannot engage.
          # registry.npmjs.org is the default anyway.

      # npm 10 (what Node 22 ships) cannot resolve this workspace graph
      # without a lockfile — arborist dies in #loadPeerSet on vitest with
      # "Cannot read properties of null (reading 'edgesOut')". npm 11 does
      # it fine. Verified on a clean clone at Node 22.23.1.
      - run: npm i -g npm@11

      # From the lockfile, and without dependency lifecycle scripts: this job
      # holds an npm publish token, so it is the worst place to run code a
      # dependency chose. build-gate builds the same artifacts this way.
      - name: Install workspace
        run: npm ci --ignore-scripts

      - name: Build web UI + CLI
        run: |
          npm run build -w @foxschema/web
          npm run build -w @foxschema/cli

      - name: Prepare npm pack folder
        run: node apps/cli/scripts/prepare-publish.mjs

      # npm picks up the OIDC credential on its own; there is no env to set.
      # Needs npm >= 11.5.1, which the npm@11 install above satisfies.
      - name: Publish to npm
        working-directory: apps/cli/npm-pack
        run: npm publish --access public
